<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Gửi cậu 💌</title>
<style>
  *{box-sizing:border-box;margin:0}
  html{height:100%;height:100vh;height:100dvh;background:radial-gradient(circle at 50% 40%,#FCE4EC,#F8BBD0 70%);overflow:hidden;overscroll-behavior:none}
  body{height:100%;height:100vh;height:100dvh;display:grid;place-items:center;overflow:hidden;overscroll-behavior:none;text-align:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    font-family:"Segoe UI",system-ui,sans-serif;color:#880E4F;
    background:radial-gradient(circle at 50% 40%,#FCE4EC,#F8BBD0 70%);}
  canvas{position:fixed;inset:0;z-index:0;width:100%;height:100%;touch-action:none;cursor:grab}
  canvas.bg{pointer-events:none}
  #stage{position:fixed;left:env(safe-area-inset-left);right:env(safe-area-inset-right);bottom:calc(env(safe-area-inset-bottom) + clamp(12px,7vh,56px));z-index:2;pointer-events:none;padding:0 20px;transition:opacity .6s}
  #stage>*{pointer-events:auto}
  #hint{font-size:clamp(.9rem,2.5vw,1.05rem);opacity:.85;animation:pulse 2s infinite}
  @keyframes pulse{50%{opacity:.4}}
  #ask{display:none}
  #ask p{min-height:0;margin-bottom:6px}
  #asktxt{position:fixed;top:calc(env(safe-area-inset-top) + 80px);left:50%;transform:translateX(-50%);width:max-content;max-width:calc(100% - max(env(safe-area-inset-left),env(safe-area-inset-right)) - max(env(safe-area-inset-left),env(safe-area-inset-right)) - 32px);z-index:5;padding:8px 16px;border-radius:99px;background:#fff8;color:#880E4F;pointer-events:none}
  .screen{display:none;position:relative;width:min(520px,calc(100% - 32px));padding:clamp(16px,4vw,24px);z-index:1;animation:in .8s}
  .screen.on{display:block}
  @keyframes in{from{opacity:0;transform:translateY(20px)}}
  h1{color:#AD1457;font-size:clamp(1.4rem,4vw,1.8rem);margin-bottom:12px}
  p{line-height:1.7;font-size:clamp(.95rem,2.5vw,1.1rem);min-height:9em}
  button{font:inherit;font-size:clamp(.95rem,2.5vw,1.1rem);border:0;border-radius:99px;padding:clamp(10px,2vw,12px) clamp(16px,4vw,28px);margin:clamp(4px,1.5vw,8px);
    cursor:pointer;background:#EC407A;color:#fff;box-shadow:0 0 22px #EC407A88;transition:transform .2s}
  button:hover{transform:scale(1.06)}
  #open{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 1vh + 70px);width:min(160px,calc(100vw - max(env(safe-area-inset-left),env(safe-area-inset-right)) - max(env(safe-area-inset-left),env(safe-area-inset-right)) - 32px));height:54px;margin:0;padding:0;z-index:4;transform:translateX(-50%);transition:width .4s,height .4s,bottom .4s,font-size .4s,border-radius .4s,transform .2s}
  #open:hover{transform:translateX(-50%) scale(1.06)}
  #open.fullscreen{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;margin:0;padding:0;border-radius:0;z-index:4;font-size:12vw;transform:none}
  #open.fullscreen:hover{transform:none}
  #later{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + max(1vh,10px));width:max-content;max-width:calc(100vw - env(safe-area-inset-left) - env(safe-area-inset-right) - 20px);margin:0;z-index:5;transform:translateX(-50%);background:#ffffffdd;color:#AD1457;box-shadow:none;border:1px solid #EC407A}
  #later:hover{transform:translateX(-50%) scale(1.06)}
  #no{position:relative;z-index:4;background:#ffffffdd;color:#EC407A;box-shadow:none;border:1px solid #EC407A}
  #no:hover{transform:none}
  #musicControls{position:fixed;top:calc(env(safe-area-inset-top) + 14px);right:calc(env(safe-area-inset-right) + 14px);z-index:5;display:none;align-items:center;gap:8px;padding:5px;border-radius:99px;background:#ffffffdd;color:#EC407A}
  #snd{display:grid;place-items:center;width:40px;height:40px;padding:0;margin:0;font-size:1.2rem;background:#EC407A;color:#fff;box-shadow:none;border:0;border-radius:50%}
  #vol{width:90px;accent-color:#EC407A}
  #s2{max-height:calc(100vh - env(safe-area-inset-top) - env(safe-area-inset-bottom));max-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));overflow-y:auto;-webkit-overflow-scrolling:touch}
  #letter p{min-height:0;margin-bottom:16px;font-size:clamp(.95rem,2.2vw,1.02rem);text-align:left;overflow-wrap:anywhere}
  #next{animation:in .8s}
  .fl{position:fixed;bottom:-40px;pointer-events:none;z-index:3;animation:up linear forwards}
  @keyframes up{to{transform:translateY(-110vh) rotate(40deg);opacity:0}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="musicControls">
  <button id="snd" onclick="toggleMusic()">🔊</button>
  <input type="range" id="vol" min="0" max="1" step="0.05" value="0.7" aria-label="Âm lượng" oninput="setVolume()">
</div>

<div id="stage">
  <div id="hint">Chạm vào để xem điều bất ngờ ✨ (kéo để xoay)</div>
  <div id="ask">
    <p id="asktxt">Cậu có muốn mở trái tim này ra không? 💗</p>
    <button id="open" onclick="openHeart()">Mở ra 💖</button>
    <button id="later" onclick="later()">Chưa đâu</button>
  </div>
</div>

<div class="screen" id="s2">
  <h1>Gửi <span class="name"></span>,</h1>
  <div id="letter"></div>
</div>

<div class="screen" id="s3">
  <h1>Cho tớ hỏi một câu nhé…</h1>
  <p style="min-height:3em" id="q">Cậu có muốn cùng tớ đi tiếp một chặng đường, từ từ tìm hiểu nhau không? 🥺💗</p>
  <button id="yes" onclick="sayYes()">Đồng ý 💖</button>
  <button id="no" onclick="sayNo()">Không</button>
  <p id="tease" style="min-height:1.5em"></p>
</div>

<script>
// ✏️ SỬA Ở ĐÂY: tên người ấy, lời nhắn, lời kết
const NAME = "Minh Thảo";
const LETTER = `
Tớ biết rằng cũng đã khá lâu rồi kể từ lần cuối tụi mình gặp nhau. Có lẽ vì vậy mà khi tớ nói rằng tớ thích cậu, cậu sẽ có đôi chút bất ngờ và hoài nghi, không biết liệu tình cảm mà tớ dành cho cậu có thực sự nghiêm túc hay không.

Thật ra, tớ hiểu rằng chỉ bằng một vài lời nói thì rất khó để cậu có thể cảm nhận được tình cảm của tớ. Tớ nghĩ rằng tình cảm không chỉ nằm ở những lời nói, mà còn cần được thể hiện qua thời gian, sự quan tâm và những hành động nhỏ trong cuộc sống hằng ngày. Tớ hy vọng rằng qua khoảng thời gian tìm hiểu nhau sắp tới, cậu sẽ dần cảm nhận được điều đó.

Tớ thực sự rất vui vì cậu đã đồng ý cho cả hai một cơ hội để tìm hiểu nhau. Tớ biết tụi mình vẫn còn nhiều điều chưa biết về đối phương, nhưng tớ mong rằng cả hai sẽ có thể thoải mái chia sẻ, lắng nghe và thấu hiểu nhau hơn. Tớ muốn được biết thêm về những sở thích, thói quen, những điều khiến cậu vui hay đôi khi là cả những chuyện buồn mà cậu muốn chia sẻ.

Tớ không mong mọi thứ phải diễn ra thật nhanh hay lúc nào cũng hoàn hảo. Tớ chỉ hy vọng cả hai có thể dành thời gian cho nhau, cùng tạo nên những kỷ niệm đẹp và dần trở nên gần gũi hơn. Tớ không biết tương lai sẽ như thế nào, nhưng ở hiện tại, tớ thực sự muốn nghiêm túc với cơ hội mà tụi mình đang có.

À, tớ cũng muốn gửi cậu một bài hát, đó là **"để dành cho em" của Dangrangto**. Khi nghe bài hát này, tớ cảm thấy có những thông điệp khá giống với điều tớ muốn chia sẻ với cậu. Đặc biệt là suy nghĩ rằng tình yêu không phải tìm kiếm một người hoàn hảo, mà là khi hai người có thể chấp nhận những điều chưa hoàn hảo của nhau, cùng thấu hiểu và cố gắng để trở nên tốt hơn.

Tớ nghĩ chẳng có ai là hoàn hảo cả, bản thân tớ cũng vậy. Nhưng tớ tin rằng nếu cả hai thật sự muốn dành thời gian cho nhau, tụi mình có thể học cách hiểu nhau hơn và cùng nhau tạo nên những điều tốt đẹp.

Cuối cùng, cảm ơn cậu vì đã cho tụi mình cơ hội này. Hy vọng rằng khoảng thời gian sắp tới sẽ có thật nhiều cuộc trò chuyện thú vị, những lần gặp gỡ đáng nhớ và những kỷ niệm thật đẹp.

**Mong rằng bài hát này sẽ trở thành một kỷ niệm nhỏ dành riêng cho cậu và cho cả tụi mình.** ❤️
`;
const MUSIC_FILE = "nhac.mp3";
const TYPE_EFFECT = true;   // true = chữ chạy từ từ, false = hiện hết ngay (để test)

const $ = id => document.getElementById(id);
document.querySelectorAll(".name").forEach(e => e.textContent = NAME);
const go = id => {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $(id).classList.add("on");
};

/* ---------- Hạt 3D: đĩa thiên hà -> trái tim -> nổ tung ---------- */
const cv = $("cv"), g = cv.getContext("2d");
let W, H, dpr, unit, heartCenterY;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = cv.width = innerWidth * dpr; H = cv.height = innerHeight * dpr;
  const safeBottom = parseFloat(getComputedStyle(document.body).paddingBottom) || 0;
  const landscape = innerWidth > innerHeight;
  const heartArea = Math.max(H * .25, H - (180 + safeBottom) * dpr);
  unit = Math.min(W / 44, H / 40, landscape ? heartArea / 40 : Infinity);
  heartCenterY = landscape ? heartArea / 2 : H * .42;
}
addEventListener("resize", resize); resize();
addEventListener("orientationchange", resize);
window.visualViewport?.addEventListener("resize", resize);

const N = 14000, R = 15;
const P = Array.from({length: N}, () => {
  // đích 1: đĩa thiên hà (xoắn ốc)
  const r = R * Math.sqrt(Math.random()), a = Math.random() * 6.283 + r * 0.25;
  const disc = [r * Math.cos(a), (Math.random() - .5) * 1.2, r * Math.sin(a)];
  // đích 2: trái tim đặc có độ dày
  const t = Math.random() * 6.283, s = Math.random() < 0.35 ? 1 : Math.sqrt(Math.random());  // 35% hạt nằm viền cho rõ hình tim
  const hx = 16 * Math.sin(t) ** 3;
  const hy = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
  const heart = [hx * s, -(hy - 2) * s, (Math.random() - .5) * 8 * (0.3 + s * 0.7)];
  const z = Math.random() * 2;
  return {disc, heart, c: disc.slice(), v: null, d: 0.02 + Math.random() * 0.05, z,
          cd: z < .7 ? "#C2185B" : "#EC407A", ch: z < .7 ? "#C2185B" : "#EC407A"};
});

let mode = "disc", yaw = 0, pitch = 1.0, vy = 0.004, vp = 0, fade = 1, T = 0;
let down = false, moved = 0, lx = 0, ly = 0;

cv.addEventListener("pointerdown", e => {
  startMusic();
  down = true; moved = 0; lx = e.clientX; ly = e.clientY; cv.setPointerCapture(e.pointerId);
  cv.style.cursor = "grabbing";
});
cv.addEventListener("pointermove", e => {
  if (!down) return;
  const dx = e.clientX - lx, dy = e.clientY - ly;
  lx = e.clientX; ly = e.clientY; moved += Math.abs(dx) + Math.abs(dy);
  yaw += dx * 0.012; pitch += dy * 0.012;
  vy = dx * 0.002; vp = dy * 0.002;
});
cv.addEventListener("pointerup", () => {
  down = false; cv.style.cursor = "grab";
  if (moved < 8 && mode === "disc") toHeart();  // chạm (không kéo) lần đầu
});

function toHeart() {
  mode = "heart";
  $("hint").style.display = "none";
  setTimeout(() => { $("ask").style.display = "block"; }, 2200);
}
let grow = 0;
function later() {
  const messages = [
    "Mở đi mà Thảo, tớ chuẩn bị lâu lắm rồi 🥺",
    "Một xíu thôi Thảo ơi, tớ hứa không có gì đáng sợ đâu! 🥹",
    "Thôi mà Thảo ơi, mở đi nha 💗",
    "Năn nỉ đó Thảo, bấm một cái thôi 🙏",
    "Cậu tò mò rồi đúng không, Thảo? Tớ biết mà 😏",
    "Thảo ơi, nút này đang lớn thêm vì cậu đó 🌷",
    "Tớ đợi cậu bấm từ nãy giờ nè, Thảo 🥰",
    "Đừng bắt tớ năn nỉ thêm nữa mà, Thảo ơi 💌",
    "Nút sắp to hết màn hình rồi nè Thảo 😆",
    "Cậu vẫn chưa mềm lòng sao, Thảo ơi? 🥺",
    "Tớ chỉ chờ một cú chạm của cậu thôi, Thảo 💖",
    "Giờ thì cậu hết đường trốn rồi nha Thảo 😝"
  ];
  grow = Math.min(grow + 1, messages.length);
  const open = $("open");
  if (grow === messages.length) {
    open.style.width = "";
    open.style.height = "";
    open.style.bottom = "";
    open.style.fontSize = "";
    open.style.borderRadius = "";
    open.classList.add("fullscreen");
    $("later").style.display = "none";
  } else {
    const step = grow / messages.length;
    open.style.width = `min(calc(${160 * (1 - step)}px + ${100 * step}vw), calc(100vw - max(env(safe-area-inset-left), env(safe-area-inset-right)) - max(env(safe-area-inset-left), env(safe-area-inset-right)) - 20px))`;
    open.style.height = `min(calc(${54 * (1 - step)}px + ${100 * step}dvh), calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom) - ${1 - step}vh - ${70 * (1 - step)}px))`;
    open.style.bottom = `calc(env(safe-area-inset-bottom) + ${1 - step}vh + ${70 * (1 - step)}px)`;
    open.style.fontSize = `calc(${1.1 * (1 - step)}rem + ${12 * step}vw)`;
    open.style.borderRadius = `${99 * (1 - step)}px`;
  }
  $("asktxt").textContent = messages[grow - 1];
}
function openHeart() {
  mode = "burst"; $("stage").style.opacity = 0;
  P.forEach(p => {
    const x = p.c[0], y = p.c[1], z = p.c[2], l = Math.hypot(x, y, z) || 1, sp = 0.15 + Math.random() * 0.5;
    p.v = [x / l * sp, y / l * sp, z / l * sp];
  });
  cv.classList.add("bg");
  showLetter();
  hearts(60);
  setInterval(() => hearts(10), 2500);
  setTimeout(() => { $("stage").style.display = "none"; go("s2"); }, 1500);
}

function frame() {
  T += 0.016;
  if (!down) {
    yaw += vy; pitch += vp; vp *= 0.95;
    vy += ((mode === "disc" ? 0.004 : 0.006) - vy) * 0.03;  // quay đều khi buông tay
    if (mode !== "disc") pitch += (0.05 - pitch) * 0.03;      // trái tim dần quay về thẳng
  }
  if (mode === "burst") fade = Math.max(0.3, fade - 0.012);  // còn lại bụi hạt làm nền
  const pulse = mode === "heart" ? 1 + 0.05 * Math.max(0, Math.sin(T * 3.2)) : 1;
  const cy = Math.cos(yaw), sy = Math.sin(yaw), cp = Math.cos(pitch), sp = Math.sin(pitch);
  g.clearRect(0, 0, W, H);
  g.globalCompositeOperation = "source-over";
  for (const p of P) {
    if (mode === "burst") for (let i = 0; i < 3; i++) { p.c[i] += p.v[i]; p.v[i] *= 0.985; }
    else { const tg = mode === "disc" ? p.disc : p.heart; for (let i = 0; i < 3; i++) p.c[i] += (tg[i] - p.c[i]) * p.d; }
    const x = p.c[0] * pulse, y = p.c[1] * pulse, z = p.c[2] * pulse;
    const x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
    const y2 = y * cp - z1 * sp, z2 = y * sp + z1 * cp;
    const k = 70 / (70 + z2);
    const sz = (1.4 + p.z * 0.9) * k * dpr;
    g.globalAlpha = Math.min(0.95, 0.55 + k * 0.35) * fade;
    g.fillStyle = mode === "disc" ? p.cd : p.ch;
    g.fillRect(W / 2 + x1 * unit * k, heartCenterY + y2 * unit * k, sz, sz);
  }
  requestAnimationFrame(frame);
}
frame();

/* ---------- Nhạc nền (bắt đầu ở lần chạm đầu tiên) ---------- */
let audio, musicOn = false, muted = false;
function startMusic() {
  if (musicOn) return;
  musicOn = true; $("musicControls").style.display = "flex";
  audio = new Audio(MUSIC_FILE);
  audio.loop = true;
  audio.volume = Number($("vol").value);
  audio.muted = muted;
  audio.play().catch(() => { musicOn = false; });  // lỗi thì lần chạm sau thử lại
}
function toggleMusic() {
  muted = !muted; $("snd").textContent = muted || $("vol").value === "0" ? "🔇" : "🔊";
  if (audio) audio.muted = muted;
}
function setVolume() {
  if (audio) audio.volume = Number($("vol").value);
  $("snd").textContent = muted || $("vol").value === "0" ? "🔇" : "🔊";
}

/* ---------- Thư và hiệu ứng trái tim ---------- */
async function showLetter() {
  await new Promise(resolve => setTimeout(resolve, 1550));  // đợi màn s2 hiện ra
  const paragraphs = LETTER.trim().split(/\n\s*\n/);
  for (const [index, txt] of paragraphs.entries()) {
    const p = document.createElement("p");
    $("letter").appendChild(p);
    for (const part of txt.split(/(\*\*.+?\*\*)/g)) {
      const bold = /^\*\*.+?\*\*$/.test(part);
      const node = document.createTextNode("");
      if (bold) {
        const b = document.createElement("b");
        b.appendChild(node);
        p.appendChild(b);
      } else {
        p.appendChild(node);
      }
      if (TYPE_EFFECT) {
        for (const char of (bold ? part.slice(2, -2) : part)) {
          node.appendData(char);
          $("s2").scrollTop = $("s2").scrollHeight;
          await new Promise(resolve => setTimeout(resolve, 35));
        }
      } else {
        node.appendData(bold ? part.slice(2, -2) : part);
      }
    }
    if (TYPE_EFFECT && index < paragraphs.length - 1) {
      await new Promise(resolve => setTimeout(resolve, 600));
    }
  }
  const next = document.createElement("button");
  next.id = "next";
  next.textContent = "Tiếp nữa nè →";
  next.onclick = () => go("s3");
  $("s2").appendChild(next);
  $("s2").scrollTop = $("s2").scrollHeight;
}
let noDodges = 0;
function dodgeNo(event) {
  event.preventDefault();
  const no = $("no"), yes = $("yes");
  if (no.parentElement !== document.body) {
    no.style.position = "fixed";
    no.style.margin = "0";
    document.body.appendChild(no);
  }
  const messages = [
    "Hehe Thảo ơi, bắt hụt rồi nha 😝", "Nút Không chạy nhanh quá ha 😜",
    "Suýt chạm được rồi đó, Thảo 🙈", "Thử lần nữa xem, nút lại trốn rồi 😆",
    "Nút Không bảo tớ đừng để cậu bắt được 🤭",
    "Thảo ơi, bấm Đi chứ và cho tớ một cơ hội nha 🥺",
    "Tớ nghiêm túc mà, cậu bấm Đi chứ nhé 💗",
    "Tim tớ đang chờ cậu ở nút Đi chứ đó 💖",
    "Cho tớ được ở bên cậu thêm một chút nha, Thảo 🌷",
    "Năn nỉ cậu đó, bấm Đi chứ cho tớ vui nha 🥰"
  ];
  $("tease").textContent = messages[noDodges < 5 ? noDodges : 5 + (noDodges - 5) % (messages.length - 5)];
  noDodges++;
  yes.style.transform = `scale(${Math.min(1 + noDodges * .06, 1.6)})`;

  const margin = 10, bodyStyle = getComputedStyle(document.body);
  const safeLeft = parseFloat(bodyStyle.paddingLeft) || 0;
  const safeRight = parseFloat(bodyStyle.paddingRight) || 0;
  const safeTop = parseFloat(bodyStyle.paddingTop) || 0;
  const safeBottom = parseFloat(bodyStyle.paddingBottom) || 0;
  const viewportMaxX = Math.max(0, innerWidth - no.offsetWidth);
  const viewportMaxY = Math.max(0, innerHeight - no.offsetHeight);
  const minX = Math.min(viewportMaxX, safeLeft + margin);
  const minY = Math.min(viewportMaxY, safeTop + margin);
  const maxX = Math.max(minX, Math.min(viewportMaxX, innerWidth - safeRight - margin - no.offsetWidth));
  const maxY = Math.max(minY, Math.min(viewportMaxY, innerHeight - safeBottom - margin - no.offsetHeight));
  const yesBox = yes.getBoundingClientRect();
  let x, y;
  for (let attempt = 0; attempt < 20; attempt++) {
    x = minX + Math.random() * (maxX - minX);
    y = minY + Math.random() * (maxY - minY);
    if (x + no.offsetWidth < yesBox.left || x > yesBox.right ||
        y + no.offsetHeight < yesBox.top || y > yesBox.bottom) break;
  }
  no.style.left = `${x}px`;
  no.style.top = `${y}px`;
}
$("no").addEventListener("mouseover", dodgeNo);
$("no").addEventListener("pointerdown", dodgeNo);
if (!window.PointerEvent) $("no").addEventListener("touchstart", dodgeNo, {passive:false});
$("no").addEventListener("click", dodgeNo);

function sayYes() {
  hearts(60);
  $("s3").querySelector("h1").textContent = "Yayyy! 🥰";
  $("q").textContent = 'Hy vọng rằng trong một tương lai không xa, tớ sẽ có cơ hội được nghe cậu nói: "Tớ đồng ý làm người yêu cậu nhé!" ❤️';
  $("yes").style.display = "none";
  $("no").style.display = "none";
  $("tease").style.display = "none";
}
function hearts(n) {
  for (let i = 0; i < n; i++) {
    const h = document.createElement("div");
    h.className = "fl";
    h.textContent = ["💖", "💗", "💕", "🌸", "✨"][i % 5];
    h.style.left = Math.random() * 100 + "vw";
    h.style.fontSize = 18 + Math.random() * 30 + "px";
    h.style.animationDuration = 3 + Math.random() * 4 + "s";
    h.style.animationDelay = Math.random() * 2 + "s";
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 9000);
  }
}
